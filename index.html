<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>De NovaBox-zaak</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Concept: beveiligingsconsole van een gamestudio. Kamerlijst links, werkvlak in het midden, dossier rechts.
   Pixel-display voor titels en score, rustige sans voor lezen, mono voor code. */
:root {
  --bg: #ECEFF5; --panel: #FFFFFF; --panel2: #F4F6FA; --ink: #131A2C; --muted: #566179; --line: #D3D9E6;
  --accent: #0B7F82; --accent-ink: #FFFFFF; --accent-soft: #DDF1F1;
  --coin: #B87A00; --coin-soft: #FFF1CC;
  --good: #1A8F55; --good-soft: #DDF4E7; --bad: #C93A33; --bad-soft: #FBE3E1;
  --code-bg: #0F1626; --code-ink: #E6EDF9; --code-gutter: #7C89A8; --code-line: #1C2640;
  --font-display: 'Silkscreen', 'Courier New', monospace;
  --font-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B101C; --panel: #141B2B; --panel2: #1A2336; --ink: #E7ECF7; --muted: #95A2BE; --line: #29334C;
    --accent: #3CCBC5; --accent-ink: #06222A; --accent-soft: #123036;
    --coin: #FFC83D; --coin-soft: #3A2E10;
    --good: #3DD598; --good-soft: #12342A; --bad: #FF7168; --bad-soft: #3B1A1A;
    --code-bg: #090D18; --code-ink: #E6EDF9; --code-gutter: #6C7898; --code-line: #151E35;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B101C; --panel: #141B2B; --panel2: #1A2336; --ink: #E7ECF7; --muted: #95A2BE; --line: #29334C;
  --accent: #3CCBC5; --accent-ink: #06222A; --accent-soft: #123036;
  --coin: #FFC83D; --coin-soft: #3A2E10;
  --good: #3DD598; --good-soft: #12342A; --bad: #FF7168; --bad-soft: #3B1A1A;
  --code-bg: #090D18; --code-ink: #E6EDF9; --code-gutter: #6C7898; --code-line: #151E35;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; padding-block: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3, h4 { margin: 0; font-weight: 600; text-wrap: balance; }
p { margin: 0 0 .7em; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
code { font-family: var(--font-mono); font-size: .88em; background: var(--panel2); border: 1px solid var(--line); padding: 0 .3em; border-radius: 4px; }
.px { font-family: var(--font-display); letter-spacing: .02em; }
.wrap { max-width: 1320px; margin: 0 auto; }

/* ---------- topbar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand .logo { font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: .06em; }
.brand .case { color: var(--muted); font-size: 14px; border-left: 2px solid var(--line); padding-left: 12px; }
.hud { display: flex; align-items: center; gap: 20px; }
.pips { display: flex; gap: 5px; }
.pip { width: 14px; height: 14px; border: 2px solid var(--line); background: transparent; }
.pip.done { background: var(--accent); border-color: var(--accent); }
.pip.now { border-color: var(--ink); }
.score { text-align: right; line-height: 1; }
.score small { display: block; font-size: 11px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
.score b { font-family: var(--font-display); font-size: 30px; color: var(--coin); font-weight: 700; display: inline-block; min-width: 3ch; font-variant-numeric: tabular-nums; }
.score b.flash { animation: flash .6s ease; }
@keyframes flash { 0% { transform: translateY(-6px); opacity: .3; } 100% { transform: none; opacity: 1; } }

/* ---------- intro */
.intro { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 32px; padding-block: 12px 48px; align-items: start; }
.intro h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(34px, 6vw, 60px); line-height: 1.02; letter-spacing: .01em; margin: 4px 0 18px; }
.eyebrow { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.lead { font-size: 18px; max-width: 58ch; }
.goal { background: var(--panel); border: 2px solid var(--ink); padding: 14px 16px; margin: 20px 0; max-width: 58ch; }
.goal b { font-family: var(--font-display); font-size: 14px; letter-spacing: .08em; color: var(--accent); display: block; margin-bottom: 4px; }
.vault { display: block; width: min(320px, 100%); margin: 18px 0 0; }
.card { background: var(--panel); border: 1px solid var(--line); padding: 20px; }
.card + .card { margin-top: 16px; }
.card h2 { font-size: 17px; margin-bottom: 12px; }
.steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; counter-increment: s; }
.steps li::before { content: counter(s); font-family: var(--font-display); background: var(--accent); color: var(--accent-ink); width: 28px; height: 28px; display: grid; place-items: center; font-size: 14px; font-weight: 700; }
.costs { width: 100%; border-collapse: collapse; font-size: 15px; }
.costs td { padding: 6px 0; border-bottom: 1px solid var(--line); }
.costs td:last-child { text-align: right; font-family: var(--font-display); color: var(--coin); font-weight: 700; white-space: nowrap; }
.costs tr:last-child td { border-bottom: 0; }
label.field { display: block; font-weight: 500; margin-bottom: 6px; }
input[type=text] { width: 100%; font: inherit; padding: 11px 12px; background: var(--panel2); color: var(--ink); border: 1px solid var(--line); border-radius: 0; }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 2px solid var(--ink); background: var(--panel); padding: 10px 18px; font-weight: 600; border-radius: 0; box-shadow: 3px 3px 0 var(--ink); transition: transform .08s, box-shadow .08s; }
.btn:hover { transform: translate(1px, 1px); box-shadow: 2px 2px 0 var(--ink); }
.btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.danger { background: var(--bad); color: #fff; border-color: var(--ink); }
.btn[disabled] { opacity: .5; cursor: not-allowed; box-shadow: none; transform: none; }
.btn.small { padding: 6px 12px; font-size: 14px; box-shadow: 2px 2px 0 var(--ink); }
.linkbtn { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 4px 0; }

/* ---------- spel */
.game { display: grid; grid-template-columns: 220px minmax(0, 1fr) 380px; gap: 20px; padding-bottom: 64px; align-items: start; }
.rail { display: grid; gap: 8px; position: sticky; top: 12px; }
.room-btn { display: grid; grid-template-columns: 28px 1fr; gap: 10px; text-align: left; align-items: center; background: var(--panel); border: 1px solid var(--line); padding: 10px 12px; border-radius: 0; }
.room-btn .num { width: 28px; height: 28px; display: grid; place-items: center; font-family: var(--font-display); font-size: 14px; border: 2px solid var(--line); color: var(--muted); }
.room-btn.done .num { background: var(--good); border-color: var(--good); color: #fff; }
.room-btn.now { border-color: var(--ink); box-shadow: 3px 3px 0 var(--ink); }
.room-btn.now .num { border-color: var(--ink); color: var(--ink); }
.room-btn[disabled] { opacity: .55; cursor: not-allowed; }
.room-btn b { display: block; font-size: 15px; line-height: 1.2; }
.room-btn small { color: var(--muted); font-size: 12.5px; }
.tabs { display: none; }
.work { min-width: 0; display: grid; gap: 18px; }
.panel { background: var(--panel); border: 1px solid var(--line); padding: 22px; min-width: 0; }
.chip { display: inline-block; font-size: 12.5px; padding: 2px 9px; background: var(--accent-soft); color: var(--accent); font-weight: 600; border: 1px solid transparent; }
.room-head h2 { font-family: var(--font-display); font-size: clamp(24px, 4vw, 32px); font-weight: 700; margin: 8px 0 12px; }
.story p { max-width: 70ch; }
.refs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; font-size: 13.5px; color: var(--muted); }
.refs .chip { background: var(--panel2); color: var(--muted); border-color: var(--line); font-weight: 500; }
.step { border-top: 1px solid var(--line); padding-top: 20px; margin-top: 20px; }
.step-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.step-head h3 { font-size: 18px; }
.badge { font-family: var(--font-display); font-size: 13px; padding: 2px 8px; background: var(--ink); color: var(--bg); font-weight: 700; }
.state { font-size: 13px; font-weight: 600; padding: 2px 9px; }
.state.ok { background: var(--good-soft); color: var(--good); }
.state.lock { background: var(--panel2); color: var(--muted); }
.spec { margin: 8px 0 16px; padding-left: 0; list-style: none; display: grid; gap: 6px; }
.spec li { padding-left: 22px; position: relative; max-width: 74ch; }
.spec li::before { content: ''; position: absolute; left: 4px; top: .6em; width: 8px; height: 8px; background: var(--accent); }
.spec li.sub { margin-left: 22px; }
.spec li.sub::before { background: transparent; border: 2px solid var(--accent); width: 8px; height: 8px; }
.locked-note { color: var(--muted); padding: 12px 14px; background: var(--panel2); border: 1px dashed var(--line); }

/* editor */
.editor { position: relative; display: flex; background: var(--code-bg); border: 1px solid var(--code-line); overflow-x: auto; max-width: 100%; }
.gutter { position: sticky; left: 0; background: var(--code-bg); color: var(--code-gutter); font: 400 13.5px/21px var(--font-mono); text-align: right; padding: 12px 8px 12px 10px; user-select: none; border-right: 1px solid var(--code-line); min-width: 42px; z-index: 1; }
.gutter span { display: block; height: 21px; }
.gutter span.err { background: var(--bad); color: #fff; margin-inline: -8px -8px; padding-inline: 8px; }
.editor textarea { flex: 1; min-width: 420px; background: transparent; color: var(--code-ink); border: 0; outline: 0; resize: none; font: 400 13.5px/21px var(--font-mono); padding: 12px 14px; tab-size: 4; white-space: pre; overflow-x: auto; overflow-y: hidden; caret-color: var(--coin); }
.editor:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
.editor-note { font-size: 12.5px; color: var(--muted); margin: 6px 0 12px; }
pre.code { background: var(--code-bg); color: var(--code-ink); font: 400 13.5px/21px var(--font-mono); padding: 12px 14px; margin: 0 0 12px; overflow-x: auto; border: 1px solid var(--code-line); max-width: 100%; }
.actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: 12px; }

/* resultaten */
.results { margin-top: 16px; display: grid; gap: 8px; }
.sum { font-weight: 600; padding: 10px 14px; border-left: 6px solid var(--line); background: var(--panel2); }
.sum.ok { border-color: var(--good); background: var(--good-soft); color: var(--good); }
.sum.bad { border-color: var(--bad); background: var(--bad-soft); }
.sum.bad span { color: var(--bad); }
.syntax { padding: 12px 14px; border-left: 6px solid var(--bad); background: var(--bad-soft); }
.syntax b { color: var(--bad); }
.res { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 8px 12px; background: var(--panel2); border: 1px solid var(--line); }
.res .ic { width: 20px; height: 20px; }
.res.ok .ic { color: var(--good); } .res.bad .ic { color: var(--bad); }
.res .why { color: var(--muted); font-size: 14.5px; margin-top: 2px; }
.res.bad .why { color: var(--ink); }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
.cols h5 { margin: 0 0 4px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.cols pre { margin: 0; padding: 8px 10px; font: 400 13px/1.5 var(--font-mono); background: var(--code-bg); color: var(--code-ink); overflow-x: auto; white-space: pre-wrap; word-break: break-word; min-height: 2.4em; }
details.t { margin-top: 6px; font-size: 14px; }
details.t summary { cursor: pointer; color: var(--accent); font-weight: 500; }
details.scratch { margin-top: 16px; border: 1px solid var(--line); background: var(--panel2); padding: 10px 14px; }
details.scratch summary { cursor: pointer; font-weight: 600; }
.out { margin-top: 10px; background: var(--code-bg); color: var(--code-ink); font: 400 13.5px/1.5 var(--font-mono); padding: 10px 12px; white-space: pre-wrap; min-height: 2.6em; }
.out.err { color: #FFB4AE; }

/* classify / mc / order / predict */
.classify { display: grid; gap: 8px; }
.crow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 16px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); background: var(--panel2); }
.seg { display: inline-flex; flex-wrap: wrap; }
.seg button { border: 1px solid var(--ink); background: var(--panel); padding: 5px 11px; font-size: 14px; margin-left: -1px; border-radius: 0; }
.seg button[aria-pressed=true] { background: var(--ink); color: var(--bg); }
.q { margin: 0 0 18px; padding: 14px; border: 1px solid var(--line); background: var(--panel2); }
.q p { font-weight: 500; }
.opts { display: grid; gap: 6px; }
.opt { text-align: left; padding: 9px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 0; display: grid; grid-template-columns: 22px 1fr; gap: 8px; }
.opt .dot { width: 16px; height: 16px; border: 2px solid var(--muted); border-radius: 50%; margin-top: 3px; }
.opt[aria-pressed=true] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.opt[aria-pressed=true] .dot { background: var(--ink); border-color: var(--ink); }
.q .fb { margin-top: 8px; font-size: 14.5px; }
.q.ok { border-color: var(--good); } .q.ok .fb { color: var(--good); }
.q.bad { border-color: var(--bad); } .q.bad .fb { color: var(--bad); }
.order { display: grid; gap: 6px; margin-bottom: 10px; }
.orow { display: grid; grid-template-columns: 1fr auto auto; gap: 6px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); background: var(--panel2); }
.orow button { width: 34px; height: 34px; border: 1px solid var(--ink); background: var(--panel); border-radius: 0; display: grid; place-items: center; }
.orow button[disabled] { opacity: .35; cursor: not-allowed; }
textarea.answer { width: 100%; min-height: 110px; font: 400 14px/1.5 var(--font-mono); padding: 10px 12px; background: var(--panel2); color: var(--ink); border: 1px solid var(--line); border-radius: 0; resize: vertical; }

/* hints */
.hints { margin-top: 20px; padding: 14px; border: 1px dashed var(--coin); background: var(--coin-soft); }
.hints h4 { font-size: 15px; display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.hints p.sm { font-size: 14px; color: var(--muted); margin-bottom: 10px; }
.hintbtns { display: flex; gap: 8px; flex-wrap: wrap; }
.hint { margin-top: 10px; padding: 10px 12px; background: var(--panel); border-left: 5px solid var(--coin); }
.hint b { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--coin); }
.hint pre { margin: 8px 0 0; font: 400 13.5px/1.5 var(--font-mono); background: var(--code-bg); color: var(--code-ink); padding: 8px 10px; overflow-x: auto; white-space: pre; }
.hint .txt { white-space: pre-line; }

/* aanwijzing */
.clue { margin-top: 24px; padding: 16px 18px; background: var(--accent-soft); border: 2px solid var(--accent); animation: rise .5s ease; }
.clue .px { color: var(--accent); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; }
.clue h3 { font-size: 19px; margin: 4px 0 6px; }
.clue p { margin: 0 0 10px; max-width: 64ch; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* dossier */
.dossier { position: sticky; top: 12px; display: grid; gap: 16px; max-height: calc(100vh - 24px); overflow-y: auto; }
.dossier h2 { font-family: var(--font-display); font-size: 16px; letter-spacing: .06em; margin-bottom: 10px; }
.tbl { overflow-x: auto; }
table.sus { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.sus th { text-align: left; font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); padding: 4px 6px 6px 0; font-weight: 600; white-space: nowrap; }
table.sus td { padding: 7px 6px 7px 0; border-top: 1px solid var(--line); vertical-align: top; white-space: nowrap; font-variant-numeric: tabular-nums; }
table.sus td:first-child { white-space: normal; min-width: 110px; }
.dossier .panel { padding: 16px; }
table.sus tr { cursor: pointer; }
table.sus tr:hover td { background: var(--panel2); }
table.sus tr.out td { opacity: .45; text-decoration: line-through; }
table.sus td small { display: block; color: var(--muted); text-decoration: inherit; }
.tip { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
.cl { margin: 0 0 10px; padding: 10px 12px; border: 1px solid var(--line); background: var(--panel2); }
.cl small { font-family: var(--font-display); font-size: 12px; letter-spacing: .06em; color: var(--accent); text-transform: uppercase; font-weight: 700; }
.cl.empty { border-style: dashed; color: var(--muted); }
.cl p { margin: 4px 0 0; font-size: 14.5px; }
.accuse-btn { width: 100%; justify-content: center; }

/* beschuldigen / afsluiten */
.suspects { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; margin: 16px 0; }
.sc { text-align: left; border: 1px solid var(--line); background: var(--panel2); padding: 12px; border-radius: 0; }
.sc b { display: block; }
.sc small { color: var(--muted); }
.sc[aria-pressed=true] { border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); }
.sc[disabled] { opacity: .45; text-decoration: line-through; cursor: not-allowed; }
.msg { padding: 12px 14px; margin-top: 12px; border-left: 6px solid var(--bad); background: var(--bad-soft); }
.final h2 { font-family: var(--font-display); font-size: clamp(28px, 5vw, 44px); margin: 8px 0 14px; }
.big { font-family: var(--font-display); font-size: 64px; color: var(--coin); font-weight: 700; line-height: 1; }
.final .grid { display: grid; grid-template-columns: auto 1fr; gap: 20px 28px; align-items: center; margin: 20px 0; }
.rating { font-size: 20px; font-weight: 600; }
table.chain { width: 100%; border-collapse: collapse; margin: 12px 0 0; font-size: 15px; }
table.chain th, table.chain td { text-align: left; padding: 7px 10px 7px 0; border-top: 1px solid var(--line); vertical-align: top; }
table.chain th { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border-top: 0; }
textarea.copy { width: 100%; font: 400 13.5px/1.5 var(--font-mono); padding: 10px 12px; background: var(--panel2); color: var(--ink); border: 1px solid var(--line); border-radius: 0; resize: none; }
.sr { position: absolute; left: -9999px; }
svg.i { width: 1.1em; height: 1.1em; vertical-align: -.15em; }

/* ---------- smal scherm */
@media (max-width: 1080px) {
  .game { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .rail { position: static; grid-auto-flow: column; grid-auto-columns: minmax(150px, 1fr); overflow-x: auto; padding-bottom: 4px; }
  .room-btn { grid-template-columns: 24px 1fr; padding: 8px 10px; }
  .room-btn small { display: none; }
  .tabs { display: flex; gap: 0; }
  .tabs button { flex: 1; padding: 10px; border: 1px solid var(--ink); background: var(--panel); font-weight: 600; margin-left: -1px; border-radius: 0; }
  .tabs button[aria-pressed=true] { background: var(--ink); color: var(--bg); }
  .dossier { position: static; max-height: none; }
  .game[data-tab="work"] .dossier, .game[data-tab="dossier"] .work { display: none; }
  .intro { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .panel { padding: 16px; }
  .cols { grid-template-columns: minmax(0, 1fr); }
  .crow { grid-template-columns: minmax(0, 1fr); }
  .seg button { flex: 1 1 auto; }
  .brand .case { display: none; }
  .hud { gap: 12px; }
  .score b { font-size: 24px; }
  .final .grid { grid-template-columns: minmax(0, 1fr); }
  .editor textarea { min-width: 340px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

</head><body><div class="wrap">
  <header class="top">
    <div class="brand"><span class="logo">PIXELWERF</span><span class="case">Dossier NovaBox</span></div>
    <div class="hud" id="hud" hidden>
      <div class="pips" id="pips" aria-label="Voortgang"></div>
      <div class="score" aria-live="polite"><small>Score</small><b id="score">100</b></div>
    </div>
  </header>
  <div id="view"></div>
</div>

<script>
/* Mini C#-interpreter voor de escaperoom.
   Ondersteunt: klassen, velden, properties (full/auto), constructors (overloads, default argumenten, this(...)),
   methoden, static, if/while/for/do, interpolated strings, Math, Console, string-methoden.
   Doel: leerlingcode uitvoeren met verborgen testcode en de uitvoer vergelijken. */
(function (root) {
  'use strict';

  class CsError extends Error {
    constructor(code, msg, line, file) {
      super(msg); this.code = code; this.line = line; this.file = file; this.isCs = true;
    }
  }
  class D { constructor(v) { this.v = v; } }
  class Obj { constructor(cls) { this.cls = cls; this.f = Object.create(null); } }
  const UNASSIGNED = { unassigned: true };
  const BRK = { sig: 'break' }, CNT = { sig: 'continue' };

  const TYPEKW = new Set(['int', 'double', 'float', 'long', 'short', 'byte', 'decimal', 'string', 'bool', 'char', 'object', 'var', 'void']);
  const MODS = new Set(['public', 'private', 'protected', 'internal', 'static', 'readonly', 'const', 'virtual', 'override', 'abstract', 'sealed', 'partial', 'new']);
  const RESERVED = new Set(['abstract', 'as', 'base', 'bool', 'break', 'byte', 'case', 'catch', 'char', 'class', 'const', 'continue', 'decimal', 'default', 'do', 'double', 'else', 'enum', 'false', 'finally', 'float', 'for', 'foreach', 'if', 'int', 'interface', 'internal', 'is', 'long', 'namespace', 'new', 'null', 'object', 'override', 'private', 'protected', 'public', 'readonly', 'return', 'sealed', 'short', 'static', 'string', 'struct', 'switch', 'this', 'throw', 'true', 'try', 'using', 'virtual', 'void', 'while']);

  /* ---------------------------------------------------------------- tokenizer */
  function escChar(e) {
    switch (e) { case 'n': return '\n'; case 't': return '\t'; case 'r': return '\r'; case '0': return '\0'; case '\\': return '\\'; case '"': return '"'; case "'": return "'"; default: return e; }
  }

  function lexInterp(src, i, line) {
    const parts = []; let buf = '';
    for (;;) {
      if (i >= src.length || src[i] === '\n') throw new CsError('SYNTAX', 'De tekst tussen aanhalingstekens is niet afgesloten: er ontbreekt een sluitend " .', line);
      const c = src[i];
      if (c === '"') { i++; break; }
      if (c === '\\') { buf += escChar(src[i + 1]); i += 2; continue; }
      if (c === '{') {
        if (src[i + 1] === '{') { buf += '{'; i += 2; continue; }
        let j = i + 1, depth = 0, fmtAt = -1;
        while (j < src.length) {
          const d = src[j];
          if (d === '"') { j++; while (j < src.length && src[j] !== '"') { if (src[j] === '\\') j++; j++; } }
          else if (d === '(' || d === '[') depth++;
          else if (d === ')' || d === ']') depth--;
          else if (d === '}') { if (depth === 0) break; }
          else if (d === ':' && depth === 0 && fmtAt < 0) fmtAt = j;
          j++;
        }
        if (j >= src.length) throw new CsError('SYNTAX', 'In een $"..." tekst ontbreekt een sluitende } .', line);
        const inner = fmtAt < 0 ? src.slice(i + 1, j) : src.slice(i + 1, fmtAt);
        const fmt = fmtAt < 0 ? null : src.slice(fmtAt + 1, j);
        if (buf) { parts.push({ s: buf }); buf = ''; }
        parts.push({ src: inner, fmt });
        i = j + 1; continue;
      }
      if (c === '}') {
        if (src[i + 1] === '}') { buf += '}'; i += 2; continue; }
        throw new CsError('SYNTAX', 'In een $"..." tekst staat een losse } . Wil je een accolade tonen, schrijf dan }}.', line);
      }
      buf += c; i++;
    }
    if (buf) parts.push({ s: buf });
    return { parts, end: i };
  }

  function tokenize(src, baseLine) {
    const toks = [], comments = []; let i = 0, line = baseLine || 1; const n = src.length;
    const push = (k, v, extra) => toks.push(Object.assign({ k, v, line }, extra || {}));
    while (i < n) {
      const c = src[i];
      if (c === '\n') { line++; i++; continue; }
      if (c === ' ' || c === '\t' || c === '\r' || c === '﻿') { i++; continue; }
      if (c === '/' && src[i + 1] === '/') { let j = i; while (j < n && src[j] !== '\n') j++; comments.push({ line, endLine: line, text: src.slice(i, j) }); i = j; continue; }
      if (c === '/' && src[i + 1] === '*') {
        const j = src.indexOf('*/', i + 2);
        if (j < 0) throw new CsError('SYNTAX', 'Een commentaarblok /* ... */ is niet afgesloten.', line);
        const text = src.slice(i, j + 2); const start = line; line += (text.match(/\n/g) || []).length;
        comments.push({ line: start, endLine: line, text }); i = j + 2; continue;
      }
      if (c === '"') {
        let j = i + 1, s = '';
        for (;;) {
          if (j >= n || src[j] === '\n') throw new CsError('SYNTAX', 'De tekst tussen aanhalingstekens is niet afgesloten: er ontbreekt een sluitend " .', line);
          if (src[j] === '"') break;
          if (src[j] === '\\') { s += escChar(src[j + 1]); j += 2; continue; }
          s += src[j]; j++;
        }
        push('str', s); i = j + 1; continue;
      }
      if (c === '$' && src[i + 1] === '"') {
        const r = lexInterp(src, i + 2, line); push('istr', null, { parts: r.parts }); i = r.end; continue;
      }
      if (c === "'") {
        let j = i + 1, s;
        if (src[j] === '\\') { s = escChar(src[j + 1]); j += 2; } else { s = src[j]; j++; }
        if (src[j] !== "'") throw new CsError('SYNTAX', "Een char tussen enkele aanhalingstekens ('a') mag maar één teken bevatten.", line);
        push('chr', s); i = j + 1; continue;
      }
      if (/[0-9]/.test(c) || (c === '.' && /[0-9]/.test(src[i + 1] || ''))) {
        let j = i, dbl = false;
        while (j < n && /[0-9]/.test(src[j])) j++;
        if (src[j] === '.' && /[0-9]/.test(src[j + 1] || '')) { dbl = true; j++; while (j < n && /[0-9]/.test(src[j])) j++; }
        if ((src[j] === 'e' || src[j] === 'E') && /[0-9+\-]/.test(src[j + 1] || '')) { dbl = true; j++; if (/[+\-]/.test(src[j])) j++; while (j < n && /[0-9]/.test(src[j])) j++; }
        const num = parseFloat(src.slice(i, j));
        const suf = src[j];
        if (suf === 'd' || suf === 'D' || suf === 'f' || suf === 'F' || suf === 'm' || suf === 'M') { dbl = true; j++; }
        else if (suf === 'L' || suf === 'l') { j++; }
        push('num', num, { dbl }); i = j; continue;
      }
      if (/[\p{L}_]/u.test(c)) {
        let j = i; while (j < n && /[\p{L}\p{N}_]/u.test(src[j])) j++;
        push('id', src.slice(i, j)); i = j; continue;
      }
      const three = src.substr(i, 2);
      if (['==', '!=', '<=', '>=', '&&', '||', '++', '--', '+=', '-=', '*=', '/=', '%=', '=>', '??'].includes(three)) { push('op', three); i += 2; continue; }
      if ('+-*/%=<>!&|^~?:;,.(){}[]'.includes(c)) { push('op', c); i++; continue; }
      throw new CsError('SYNTAX', `Onbekend teken '${c}'.`, line);
    }
    toks.push({ k: 'eof', v: '<einde>', line });
    return { toks, comments };
  }

  /* ---------------------------------------------------------------- parser */
  class Parser {
    constructor(toks, file) { this.t = toks; this.i = 0; this.file = file; }
    peek(o = 0) { return this.t[Math.min(this.i + o, this.t.length - 1)]; }
    next() { const x = this.t[this.i]; if (this.i < this.t.length - 1) this.i++; return x; }
    isOp(v, o = 0) { const x = this.peek(o); return x.k === 'op' && x.v === v; }
    isKw(v, o = 0) { const x = this.peek(o); return x.k === 'id' && x.v === v; }
    acceptOp(v) { if (this.isOp(v)) { this.next(); return true; } return false; }
    acceptKw(v) { if (this.isKw(v)) { this.next(); return true; } return false; }
    prevLine() { return this.i > 0 ? this.t[this.i - 1].line : 1; }
    fail(msg, line) { throw new CsError('SYNTAX', msg, line || this.peek().line, this.file); }
    expectOp(v) {
      if (this.isOp(v)) return this.next();
      const tk = this.peek();
      if (v === ';') this.fail(`Er ontbreekt een ';' op het einde van deze regel.`, this.prevLine());
      if (tk.k === 'eof') this.fail(`Het bestand stopt te vroeg: er ontbreekt nog een '${v}'. Controleer of elke { een bijhorende } heeft.`, tk.line);
      this.fail(`Ik verwachtte '${v}' maar vond '${tk.v === null ? tk.k : tk.v}'.`, tk.line);
    }
    expectKw(v) { if (this.isKw(v)) return this.next(); this.fail(`Ik verwachtte '${v}' maar vond '${this.peek().v}'.`); }
    ident(what) {
      const tk = this.peek();
      if (tk.k !== 'id' || RESERVED.has(tk.v)) this.fail(`Ik verwachtte ${what || 'een naam'} maar vond '${tk.v === null ? tk.k : tk.v}'.`, tk.line);
      return this.next().v;
    }

    parseUnit() {
      const classes = [];
      while (this.peek().k !== 'eof') this.parseTop(classes);
      return classes;
    }
    parseTop(classes) {
      if (this.isKw('using')) { while (!this.isOp(';') && this.peek().k !== 'eof') this.next(); this.expectOp(';'); return; }
      if (this.isKw('namespace')) {
        this.next(); while (!this.isOp('{') && !this.isOp(';') && this.peek().k !== 'eof') this.next();
        if (this.acceptOp(';')) return;
        this.expectOp('{');
        while (!this.isOp('}')) { if (this.peek().k === 'eof') this.fail("Het bestand stopt te vroeg: er ontbreekt nog een '}' om de namespace af te sluiten.", this.peek().line); this.parseTop(classes); }
        this.expectOp('}'); return;
      }
      const tk = this.peek();
      if (tk.k === 'id' && (MODS.has(tk.v) || ['class', 'enum', 'struct', 'interface'].includes(tk.v))) { classes.push(this.parseClass()); return; }
      this.fail(`Hier kan geen code staan (gevonden: '${tk.v === null ? tk.k : tk.v}'). Buiten een klasse mag alleen using, namespace of een class staan.`, tk.line);
    }
    parseClass() {
      const line = this.peek().line; const mods = new Set();
      while (this.peek().k === 'id' && MODS.has(this.peek().v)) mods.add(this.next().v);
      const kind = this.peek().v;
      if (kind !== 'class') this.fail(`'${kind}' wordt in deze escaperoom niet ondersteund. Gebruik een gewone class.`);
      this.next();
      const name = this.ident('de naam van de klasse');
      let base = null;
      if (this.acceptOp(':')) { base = this.ident('een basisklasse'); while (this.acceptOp(',')) this.ident(); }
      const cls = { k: 'class', name, mods, members: [], line, base, file: this.file };
      this.expectOp('{');
      while (!this.isOp('}')) {
        if (this.peek().k === 'eof') this.fail(`Het bestand stopt te vroeg: er ontbreekt nog een '}' om de klasse ${name} af te sluiten.`, this.peek().line);
        cls.members.push(this.parseMember(cls));
      }
      cls.endLine = this.peek().line;
      this.expectOp('}');
      return cls;
    }
    parseType() {
      const tk = this.peek();
      if (tk.k !== 'id' || (RESERVED.has(tk.v) && !TYPEKW.has(tk.v))) this.fail(`Ik verwachtte een datatype (bv. int, string of een klasse) maar vond '${tk.v === null ? tk.k : tk.v}'.`, tk.line);
      let name = this.next().v;
      while (this.isOp('.') && this.peek(1).k === 'id') { this.next(); name = this.next().v; }
      const t = { name, arr: false, generic: false, nullable: false, line: tk.line };
      if (this.isOp('<')) { // generic
        let depth = 0; t.generic = true;
        do { if (this.isOp('<')) depth++; else if (this.isOp('>')) depth--; this.next(); } while (depth > 0 && this.peek().k !== 'eof');
      }
      if (this.isOp('?') ) { t.nullable = true; this.next(); }
      while (this.isOp('[') && this.isOp(']', 1)) { this.next(); this.next(); t.arr = true; }
      return t;
    }
    parseParams() {
      const ps = []; this.expectOp('(');
      if (!this.isOp(')')) {
        do {
          while (this.isKw('ref') || this.isKw('out') || this.isKw('params') || this.isKw('this')) this.next();
          const type = this.parseType(); const name = this.ident('de naam van de parameter');
          let def = null; if (this.acceptOp('=')) def = this.parseTernary();
          ps.push({ type, name, def });
        } while (this.acceptOp(','));
      }
      this.expectOp(')'); return ps;
    }
    parseMember(cls) {
      const line = this.peek().line; const mods = new Set();
      while (this.peek().k === 'id' && MODS.has(this.peek().v)) mods.add(this.next().v);
      const tk = this.peek();
      if (tk.k === 'id' && tk.v === cls.name && this.isOp('(', 1)) { // constructor
        this.next(); const params = this.parseParams(); let chain = null;
        if (this.acceptOp(':')) {
          const kind = this.next().v; if (kind !== 'this' && kind !== 'base') this.fail("Na ':' verwacht ik this(...) of base(...).");
          this.expectOp('('); const args = []; if (!this.isOp(')')) { do { args.push(this.parseExpr()); } while (this.acceptOp(',')); } this.expectOp(')');
          chain = { kind, args };
        }
        const body = this.parseBlock();
        return { k: 'ctor', mods, params, chain, body, line, cls };
      }
      if (tk.k === 'id' && ['class', 'struct', 'enum', 'interface'].includes(tk.v)) this.fail('Een klasse binnen een klasse (nested class) wordt in deze escaperoom niet ondersteund.');
      if (tk.k === 'id' && tk.v !== 'void' && !TYPEKW.has(tk.v) && this.isOp('(', 1)) {
        this.fail(`'${tk.v}' ziet eruit als een methode of constructor zonder returntype. Een constructor heet exact zoals de klasse (${cls.name}), een methode heeft een returntype (bv. void of int).`, tk.line);
      }
      const type = this.parseType(); const nameTok = this.peek();
      const name = this.ident('de naam van een veld, property of methode');
      if (this.isOp('(')) { // method
        const params = this.parseParams(); let body = null;
        if (this.isOp('=>')) { this.next(); const e = this.parseExpr(); this.expectOp(';'); body = { k: 'block', stmts: [{ k: 'return', e, line: nameTok.line }], line: nameTok.line }; }
        else if (this.isOp(';')) { this.fail(`De methode ${name} heeft geen body. Schrijf { ... } in plaats van ';'.`); }
        else body = this.parseBlock();
        return { k: 'method', name, ret: type, mods, params, body, line: nameTok.line, cls };
      }
      if (this.isOp('{') || this.isOp('=>')) { // property
        const prop = { k: 'prop', name, type, mods, get: null, set: null, init: null, auto: false, line: nameTok.line, cls };
        if (this.acceptOp('=>')) { const e = this.parseExpr(); this.expectOp(';'); prop.get = { access: null, body: { k: 'block', stmts: [{ k: 'return', e, line: nameTok.line }], line: nameTok.line } }; return prop; }
        this.expectOp('{');
        while (!this.isOp('}')) {
          if (this.peek().k === 'eof') this.fail('Het bestand stopt te vroeg binnen een property.');
          let access = null;
          while (this.peek().k === 'id' && ['public', 'private', 'protected', 'internal'].includes(this.peek().v)) access = this.next().v;
          const kind = this.peek().v;
          if (this.peek().k !== 'id' || (kind !== 'get' && kind !== 'set' && kind !== 'init')) this.fail(`In een property verwacht ik 'get' of 'set' maar vond '${this.peek().v}'.`);
          const aline = this.next().line; let acc;
          if (this.acceptOp(';')) { acc = { access, body: null, line: aline }; prop.auto = true; }
          else if (this.acceptOp('=>')) { const e = this.parseExpr(); this.expectOp(';'); acc = { access, body: { k: 'block', stmts: [{ k: 'return', e, line: aline }], line: aline }, line: aline }; }
          else { acc = { access, body: this.parseBlock(), line: aline }; }
          if (kind === 'get') prop.get = acc; else prop.set = acc;
        }
        this.expectOp('}');
        if (this.acceptOp('=')) { prop.init = this.parseExpr(); this.expectOp(';'); }
        return prop;
      }
      // field(s)
      const decls = [];
      do {
        const dn = decls.length === 0 ? name : this.ident('de naam van het veld');
        let init = null; if (this.acceptOp('=')) init = this.parseExpr();
        decls.push({ name: dn, init });
      } while (this.acceptOp(','));
      this.expectOp(';');
      if (decls.length === 1) return { k: 'field', name, type, mods, init: decls[0].init, line: nameTok.line, cls };
      return { k: 'fields', fields: decls.map(d => ({ k: 'field', name: d.name, type, mods, init: d.init, line: nameTok.line, cls })), line: nameTok.line };
    }

    parseBlock() {
      const line = this.peek().line; this.expectOp('{'); const stmts = [];
      while (!this.isOp('}')) {
        if (this.peek().k === 'eof') this.fail("Het bestand stopt te vroeg: er ontbreekt nog een '}' (accolade sluiten).", this.peek().line);
        stmts.push(this.parseStatement());
      }
      this.expectOp('}'); return { k: 'block', stmts, line };
    }
    isDeclStart() {
      const a = this.peek(), b = this.peek(1);
      if (a.k !== 'id') return false;
      if (TYPEKW.has(a.v) && a.v !== 'void') {
        if (b.k === 'id') return true;
        if (b.k === 'op' && (b.v === '[' || b.v === '?')) return true;
        return false;
      }
      if (RESERVED.has(a.v)) return false;
      if (b.k === 'id' && !RESERVED.has(b.v)) { const c = this.peek(2); return c.k === 'op' && ['=', ';', ','].includes(c.v); }
      if (b.k === 'op' && b.v === '<') return true;
      if (b.k === 'op' && b.v === '[' && this.isOp(']', 2)) return true;
      return false;
    }
    parseVarDecl() {
      const line = this.peek().line; const type = this.parseType(); const decls = [];
      do {
        const name = this.ident('de naam van de variabele');
        let init = null; if (this.acceptOp('=')) init = this.parseExpr();
        decls.push({ name, init });
      } while (this.acceptOp(','));
      return { k: 'var', type, decls, line };
    }
    parseStatement() {
      const tk = this.peek(); const line = tk.line;
      if (this.isOp('{')) return this.parseBlock();
      if (this.isOp(';')) { this.next(); return { k: 'block', stmts: [], line }; }
      if (tk.k === 'id') {
        switch (tk.v) {
          case 'if': {
            this.next(); this.expectOp('('); const cond = this.parseExpr(); this.expectOp(')');
            const then = this.parseStatement(); let els = null; if (this.acceptKw('else')) els = this.parseStatement();
            return { k: 'if', cond, then, els, line };
          }
          case 'while': { this.next(); this.expectOp('('); const cond = this.parseExpr(); this.expectOp(')'); return { k: 'while', cond, body: this.parseStatement(), line }; }
          case 'do': { this.next(); const body = this.parseStatement(); this.expectKw('while'); this.expectOp('('); const cond = this.parseExpr(); this.expectOp(')'); this.expectOp(';'); return { k: 'do', cond, body, line }; }
          case 'for': {
            this.next(); this.expectOp('('); let init = null;
            if (!this.isOp(';')) { init = this.isDeclStart() ? this.parseVarDecl() : { k: 'expr', e: this.parseExpr(), line }; }
            this.expectOp(';'); let cond = null; if (!this.isOp(';')) cond = this.parseExpr(); this.expectOp(';');
            const iter = []; if (!this.isOp(')')) { do { iter.push(this.parseExpr()); } while (this.acceptOp(',')); }
            this.expectOp(')'); return { k: 'for', init, cond, iter, body: this.parseStatement(), line };
          }
          case 'return': { this.next(); let e = null; if (!this.isOp(';')) e = this.parseExpr(); this.expectOp(';'); return { k: 'return', e, line }; }
          case 'break': this.next(); this.expectOp(';'); return { k: 'break', line };
          case 'continue': this.next(); this.expectOp(';'); return { k: 'continue', line };
          case 'foreach': case 'switch': case 'try': case 'throw': case 'goto':
            this.fail(`'${tk.v}' wordt in deze escaperoom (nog) niet ondersteund. Los de opdracht op met de leerstof van de kamer.`, line);
        }
        if (this.isDeclStart()) { const d = this.parseVarDecl(); this.expectOp(';'); return d; }
      }
      const e = this.parseExpr(); this.expectOp(';');
      if (!['assign', 'call', 'post', 'pre', 'new'].includes(e.k)) this.fail('Dit is geen geldige opdracht. Een opdracht is een toekenning, een methode-oproep of een ++/--.', line);
      return { k: 'expr', e, line };
    }

    /* ----- expressies */
    parseExpr() { return this.parseAssign(); }
    parseAssign() {
      const left = this.parseTernary(); const tk = this.peek();
      if (tk.k === 'op' && ['=', '+=', '-=', '*=', '/=', '%='].includes(tk.v)) {
        this.next(); const value = this.parseAssign();
        return { k: 'assign', op: tk.v, target: left, value, line: tk.line };
      }
      return left;
    }
    parseTernary() {
      const c = this.parseBin(1);
      if (this.isOp('?')) { const line = this.next().line; const a = this.parseAssign(); this.expectOp(':'); const b = this.parseAssign(); return { k: 'cond', c, a, b, line }; }
      return c;
    }
    parseBin(minPrec) {
      const PREC = { '??': 0, '||': 1, '&&': 2, '==': 3, '!=': 3, '<': 4, '>': 4, '<=': 4, '>=': 4, '+': 5, '-': 5, '*': 6, '/': 6, '%': 6 };
      let left = this.parseUnary();
      for (;;) {
        const tk = this.peek();
        if (tk.k !== 'op' || !(tk.v in PREC) || PREC[tk.v] < minPrec || tk.v === '??') break;
        this.next(); const right = this.parseBin(PREC[tk.v] + 1);
        left = { k: 'bin', op: tk.v, l: left, r: right, line: tk.line };
      }
      return left;
    }
    isCast() {
      if (!this.isOp('(')) return false; const a = this.peek(1), b = this.peek(2);
      return a.k === 'id' && ['int', 'double', 'float', 'long', 'decimal', 'char', 'string', 'bool', 'object', 'short', 'byte'].includes(a.v) && b.k === 'op' && b.v === ')';
    }
    parseUnary() {
      const tk = this.peek();
      if (tk.k === 'op') {
        if (tk.v === '!' || tk.v === '-' || tk.v === '+') { this.next(); return { k: 'un', op: tk.v, e: this.parseUnary(), line: tk.line }; }

  /* ------------------------------------------------------------ controle-engine */
  function normOut(lines) { return lines.map(l => l.replace(/\s+$/, '')).join('\n').replace(/^\n+|\n+$/g, ''); }
  function whereMsg(e) {
    const base = e.message;
    if (e.file === 'test') return `Bij het uitvoeren van de test: ${base}`;
    return `${e.line ? 'Regel ' + e.line + ' van jouw code: ' : ''}${base}`;
  }
  function runWithMain(step, userCode, main, wrapName) {
    const src = `public class ${wrapName} { public static void Run() {\n${main}\n} }`;
    const files = [{ code: userCode, tag: 'user' }];
    if (step.given) files.push({ code: step.given, tag: 'given' });
    files.push({ code: src, tag: 'test' });
    return CS.runProgram(files, { cls: wrapName, method: 'Run' });
  }

  function checkCode(step, userCode) {
    const res = { syntax: null, results: [], pass: false };
    let ast;
    try { ast = CS.parse(userCode, 'user'); }
    catch (e) { if (e.isCs) { res.syntax = { line: e.line, message: e.message }; return res; } throw e; }
    let blocked = false;
    for (const c of step.structure) {
      let r; try { r = c.fn(ast); } catch (e) { r = { ok: false, detail: 'Ik kon dit onderdeel niet controleren. Controleer je code.' }; }
      res.results.push({ kind: 'struct', label: c.label, ok: !!r.ok, detail: r.detail || '' });
      if (!r.ok && c.block) blocked = true;
    }
    for (const t of step.tests) {
      if (blocked) { res.results.push({ kind: 'test', label: t.label, ok: false, skipped: true, detail: 'Los eerst de vorige punten op.', main: t.main }); continue; }
      const r = runWithMain(step, userCode, t.main, '__Test');
      const item = { kind: 'test', label: t.label, main: t.main };
      if (t.expectError) {
        if (r.ok) { item.ok = false; item.detail = 'Dit hoort een foutmelding te geven, maar de code werkte gewoon. Dat wil zeggen dat je het te open gemaakt hebt.'; }
        else if (!t.expectError.includes(r.error.code)) { item.ok = false; item.detail = whereMsg(r.error); }
        else { item.ok = true; item.detail = ''; item.note = 'Foutmelding zoals bedoeld: ' + r.error.message; }
      } else if (!r.ok) {
        item.ok = false; item.detail = whereMsg(r.error); item.expected = t.expect;
      } else {
        const got = normOut(r.out), exp = normOut(t.expect.split('\n'));
        item.expected = exp; item.got = got; item.ok = got === exp;
        if (!item.ok) item.detail = 'De uitvoer klopt niet.';
      }
      res.results.push(item);
    }
    res.pass = res.results.every(r => r.ok);
    return res;
  }
  function runScratch(step, userCode, main) {
    let ast; try { ast = CS.parse(userCode, 'user'); } catch (e) { if (e.isCs) return { ok: false, out: [], error: e }; throw e; }
    return runWithMain(step, userCode, main, '__Scratch');
  }
  function predictExpected(step) {
    const full = `${step.klasse}\n`;
    const r = runWithMain({ given: '' }, full, step.main, '__Predict');
    return r.ok ? normOut(r.out) : null;
  }

  const Tasks = { SUSPECTS, CULPRIT, ELIMINATION, ROOMS, HINT_COST, WRONG_ACCUSATION, START_SCORE, checkCode, runScratch, predictExpected, normOut };
  if (typeof module !== 'undefined' && module.exports) module.exports = Tasks; else root.Tasks = Tasks;
})(typeof window !== 'undefined' ? window : globalThis);

    let c = 0; rooms.forEach(r => { const n = S.hints[r.id] || 0; for (let i = 0; i < n; i++) c += T.HINT_COST[i]; });
    c += S.wrong.length * T.WRONG_ACCUSATION; return Math.max(0, T.START_SCORE - c);
  }
  const ratingFor = s => s >= 90 ? 'Meesterdetective' : s >= 75 ? 'Scherpe speurder' : s >= 55 ? 'Goede speurder' : 'Doorzetter';

  /* ---------------------------------------------------------------- hoofdrender */
  const view = $('#view');

  function renderDossier() { const d = $('#dossier'); if (d) d.innerHTML = dossierHTML(); const t = $('.tabs'); if (t) t.innerHTML = `<button data-act="tab" data-v="work" aria-pressed="${S.tab === 'work'}">Opdracht</button><button data-act="tab" data-v="dossier" aria-pressed="${S.tab === 'dossier'}">Dossier (${found()})</button>`; }

  /* ---------------------------------------------------------------- intro */
  function introHTML() {
    return `

        </div>

          <label class="field" for="name">Je naam</label>

  }
  function bindIntro() {
    $('#start').addEventListener('click', () => {
      S.name = $('#name').value.trim(); S.started = true; S.view = 'room'; S.open = 1; save(); render();
      window.scrollTo(0, 0);
    });
    $('#name').addEventListener('keydown', e => { if (e.key === 'Enter') $('#start').click(); });
  }

  /* ---------------------------------------------------------------- rail en dossier */
  function railHTML() {
    return rooms.map(r => {
      const d = roomDone(r), u = unlocked(r.id), now = S.view === 'room' && S.open === r.id;
      return `<button class="room-btn ${d ? 'done' : ''} ${now ? 'now' : ''}" data-act="room" data-id="${r.id}" ${u ? '' : 'disabled'} aria-current="${now ? 'step' : 'false'}">
        <span class="num">${d ? I.ok : (u ? r.id : I.lock)}</span>
        <span><b>${esc(r.plek)}</b><small>${r.hoofdstuk} · ${esc(r.cursusTitel)}</small></span></button>`;
    }).join('');
  }
  function dossierHTML() {
    const rows = T.SUSPECTS.map(s => `<tr data-act="excl" data-id="${s.id}" class="${S.excl.includes(s.id) ? 'out' : ''}" tabindex="0" role="button" aria-pressed="${S.excl.includes(s.id)}">
      <td><b>${esc(s.naam)}</b><small>${esc(s.functie)}</small></td><td>${s.verdieping === 0 ? 'bg' : s.verdieping}</td><td>${s.badge}</td><td>${s.uit}</td><td>${esc(s.drank)}</td></tr>`).join('');
    const clues = rooms.map((r, i) => roomDone(r)
      ? `<div class="cl"><small>Aanwijzing ${i + 1} · ${esc(r.clue.titel)}</small><p>${esc(r.clue.tekst)}</p></div>`
      : `<div class="cl empty"><small>Aanwijzing ${i + 1}</small><p>Nog niet gevonden. Herstel kamer ${i + 1}: ${esc(r.plek)}.</p></div>`).join('');
    return `
      <div class="panel"><h2>Verdachten</h2>
        <div class="tbl"><table class="sus"><thead><tr><th>Naam</th><th title="Verdieping waar de persoon werkt">Verd.</th><th title="Badgeniveau">Badge</th><th title="Uur van uitklokken">Uit</th><th>Drinkt</th></tr></thead><tbody>${rows}</tbody></table></div>
        <p class="tip">Tik op een rij om iemand door te strepen. Dat is enkel voor jezelf.</p></div>
      <div class="panel"><h2>Aanwijzingen (${found()}/${rooms.length})</h2>${clues}
        <button class="btn ${allDone() ? 'primary' : ''} accuse-btn" data-act="accuse" ${allDone() ? '' : 'disabled'}>${allDone() ? 'Beschuldig de dader' : 'Beschuldigen: nog ' + (rooms.length - found()) + ' kamer(s)'}</button></div>`;

  /* ---------------------------------------------------------------- werkvlak */
  function workHTML() {
    if (S.view === 'accuse') return accuseHTML();
    if (S.view === 'final') return finalHTML();
    return roomHTML(rooms[S.open - 1]);
  }
  function roomHTML(r) {
    const done = roomDone(r);
    const mainDone = S.done[r.steps[0].id];
    let prevDone = true;
    const steps = r.steps.map((st, i) => {
      const locked = i > 0 && !S.done[r.steps[i - 1].id];
      return stepHTML(r, st, i, locked);
    }).join('');
    const last = r.id === rooms.length;
    return `<section class="panel room">
      <div class="room-head"><span class="chip">Kamer ${r.id} · ${r.hoofdstuk} ${esc(r.cursusTitel)}</span><h2>${esc(r.plek)}</h2></div>
      <div class="story">${r.intro.map(p => `<p>${esc(p)}</p>`).join('')}</div>
      <div class="refs"><span>In je cursus:</span>${r.cursus.map(c => `<span class="chip">${esc(c)}</span>`).join('')}</div>
      ${steps}
      ${done ? `<div class="clue" id="clue"><span class="px">Aanwijzing ${r.id} gevonden</span><h3>${esc(r.clue.titel)}</h3><p>${esc(r.clue.tekst)}</p>
        <div class="actions">${last ? `<button class="btn primary" data-act="accuse">Naar de beschuldiging</button>` : `<button class="btn primary" data-act="room" data-id="${r.id + 1}">Naar kamer ${r.id + 1}: ${esc(rooms[r.id].plek)}</button>`}
        <button class="linkbtn" data-act="tab" data-v="dossier">Bekijk je dossier</button></div></div>` : ''}
    </section>`;
  }
  const LETTERS = ['A', 'B', 'C', 'D', 'E'];
  function stepHTML(r, st, i, locked) {
    const done = !!S.done[st.id];
    const head = `<div class="step-head"><span class="badge">${LETTERS[i]}</span><h3>${esc(st.titel)}</h3>${done ? `<span class="state ok">${I.ok} Gelukt</span>` : (locked ? `<span class="state lock">${I.lock} Vergrendeld</span>` : '')}</div>`;
    if (locked) return `<article class="step" data-step="${st.id}">${head}<p class="locked-note">Los eerst opdracht ${LETTERS[i - 1]} op.</p></article>`;
    let body = '';
    if (st.type === 'classify') body = classifyHTML(st, done);
    else if (st.type === 'mc') body = mcHTML(st, done);
    else if (st.type === 'order') body = orderHTML(st, done);
    else if (st.type === 'predict') body = predictHTML(st, done);
    else if (st.type === 'code') body = codeHTML(st, done);
    const hints = st.main === true ? hintsHTML(r, done) : '';
    return `<article class="step" data-step="${st.id}" data-room="${r.id}">${head}${body}${hints}</article>`;
  }

  /* ----- classify */
  function classifyHTML(st, done) {
    const sel = S.sel[st.id] || {};
    const rows = st.items.map((it, i) => `<div class="crow"><div>${esc(it.t)}</div><div class="seg" role="group" aria-label="${esc(it.t)}">${st.opties.map(o => `<button type="button" data-act="cls" data-step="${st.id}" data-i="${i}" data-v="${esc(o)}" aria-pressed="${sel[i] === o}" ${done ? 'disabled' : ''}>${esc(o)}</button>`).join('')}</div></div>`).join('');
    return `<p>${esc(st.vraag)}</p><div class="classify">${rows}</div>
      ${done ? '' : `<div class="actions"><button class="btn primary" data-act="chk-cls" data-step="${st.id}">Controleer</button></div><div class="results" id="res-${st.id}"></div>`}`;
  }
  /* ----- mc */
  function mcHTML(st, done) {
    const sel = S.sel[st.id] || {};
    const qs = st.vragen.map((q, qi) => `<div class="q" id="q-${st.id}-${qi}"><p>${esc(q.q)}</p><div class="opts">${q.opts.map((o, oi) => `<button type="button" class="opt" data-act="mc" data-step="${st.id}" data-q="${qi}" data-o="${oi}" aria-pressed="${sel[qi] === oi}" ${done ? 'disabled' : ''}><span class="dot"></span><span>${esc(o)}</span></button>`).join('')}</div><div class="fb">${done ? esc(q.uitleg) : ''}</div></div>`).join('');
    return `${qs}${done ? '' : `<div class="actions"><button class="btn primary" data-act="chk-mc" data-step="${st.id}">Controleer</button></div><div class="results" id="res-${st.id}"></div>`}`;
  }
  /* ----- order */
  function orderList(st) { return S.ord[st.id] || st.start.slice(); }
  function orderHTML(st, done) {
    const list = done ? st.juist : orderList(st);
    const rows = list.map((t, i) => `<div class="orow"><span>${esc(t)}</span><button type="button" data-act="mv" data-step="${st.id}" data-i="${i}" data-d="-1" ${i === 0 || done ? 'disabled' : ''} aria-label="Omhoog">${I.up}</button><button type="button" data-act="mv" data-step="${st.id}" data-i="${i}" data-d="1" ${i === list.length - 1 || done ? 'disabled' : ''} aria-label="Omlaag">${I.down}</button></div>`).join('');
    return `<p>${esc(st.vraag)}</p><div class="order">${rows}</div>${done ? '' : `<div class="actions"><button class="btn primary" data-act="chk-ord" data-step="${st.id}">Controleer</button></div><div class="results" id="res-${st.id}"></div>`}`;
  }
  /* ----- predict */
  function predictHTML(st, done) {
    const val = S.ans[st.id] || '';
    return `<p>${esc(st.vraag)}</p>
      <pre class="code">${esc(st.klasse)}</pre><pre class="code">${esc(st.main)}</pre>
      <label class="field" for="ans-${st.id}">Wat toont de console?</label>
      <textarea class="answer" id="ans-${st.id}" data-step="${st.id}" spellcheck="false" ${done ? 'readonly' : ''}>${esc(done ? T.predictExpected(st) : val)}</textarea>
      ${done ? `<p class="tip">${esc(st.uitleg)}</p>` : `<div class="actions"><button class="btn primary" data-act="chk-pred" data-step="${st.id}">Controleer</button></div><div class="results" id="res-${st.id}"></div>`}`;
  }
  /* ----- code */
  function codeHTML(st, done) {
    const val = S.drafts[st.id] !== undefined ? S.drafts[st.id] : st.starter;
    const spec = st.spec.map((s, i) => `<li class="${i > 0 && st.spec[0].endsWith(':') && !/^(Maak|Voeg|Schrijf)/.test(s) && !/^Parameters|^In de/.test(s) ? 'sub' : ''}">${md(s)}</li>`).join('');
    const scratch = st.scratch ? `<details class="scratch"><summary>Testruimte: probeer je eigen code uit</summary>
        <p class="tip">Schrijf hier een stukje Main-code dat jouw klasse gebruikt en klik op Uitvoeren. Zo zie je wat jouw klasse doet.</p>
        <div class="editor" data-ed="scratch" data-step="${st.id}"><div class="gutter" aria-hidden="true"></div><textarea id="sc-${st.id}" data-step="${st.id}" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" aria-label="Testcode">${esc(S.scratch[st.id] !== undefined ? S.scratch[st.id] : st.scratch)}</textarea></div>
        <div class="actions"><button class="btn small" data-act="run" data-step="${st.id}">Uitvoeren</button></div><div class="out" id="out-${st.id}" aria-live="polite"></div></details>` : '';
    return `<ul class="spec">${spec}</ul>
      <div class="editor" data-ed="main" data-step="${st.id}"><div class="gutter" aria-hidden="true"></div><textarea id="ed-${st.id}" data-step="${st.id}" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" aria-label="Je C#-code">${esc(val)}</textarea></div>
      <p class="editor-note">Tab = 4 spaties (druk eerst op Esc als je de editor wil verlaten met Tab). De checker rekent met een punt als decimaalteken.</p>
      <div class="actions"><button class="btn primary" data-act="check" data-step="${st.id}">Controleer mijn code</button>${val !== st.starter ? `<button class="linkbtn" data-act="reset" data-step="${st.id}">Begincode herstellen</button>` : ''}</div>
      <div class="results" id="res-${st.id}" aria-live="polite">${done ? `<div class="sum ok">${I.ok} Alle controles geslaagd.</div>` : ''}</div>${scratch}`;
  }
  /* ----- hints */
  function hintsHTML(r, done) {
    const used = S.hints[r.id] || 0;
    const btns = [0, 1, 2].map(i => {
      const shown = i < used, can = i === used && !done;
      return `<button class="btn small" data-act="hint" data-room="${r.id}" data-i="${i}" ${shown ? 'disabled' : (can ? '' : 'disabled')}>${I.bulb} Tip ${i + 1} · −${T.HINT_COST[i]}</button>`;
    }).join('');
    const shown = r.hints.slice(0, used).map((h, i) => `<div class="hint"><b>Tip ${i + 1}</b>${hintBody(h)}</div>`).join('');
    if (done && !used) return '';
    return `<div class="hints"><h4>${I.bulb} Vast? Gebruik een tip</h4>
      <p class="sm">Elke tip kost punten. Tips geven een duwtje, nooit de oplossing.</p>
      ${done ? '' : `<div class="hintbtns">${btns}</div>`}${shown}</div>`;
  }
  function hintBody(h) {
    const parts = h.split('\n\n');
    return parts.map(p => /^(public|private|[A-Za-z<>\[\]]+ [A-Za-z]+\s*[;=({]|\/\/)/.test(p.trim()) && /[;{}]/.test(p) ? `<pre>${esc(p)}</pre>` : `<div class="txt">${esc(p)}</div>`).join('');
  }

  /* ---------------------------------------------------------------- beschuldigen en einde */
  function accuseHTML() {
    const sel = S.pending;
    const cards = T.SUSPECTS.map(s => {
      const wrong = S.wrong.includes(s.id);
      return `<button class="sc" data-act="pick" data-id="${s.id}" aria-pressed="${sel === s.id}" ${wrong ? 'disabled' : ''}><b>${esc(s.naam)}</b><small>${esc(s.functie)} · verdieping ${s.verdieping === 0 ? 'bg' : s.verdieping} · badge ${s.badge} · uit ${s.uit} · ${esc(s.drank)}</small></button>`;
    }).join('');
    const who = sel ? T.SUSPECTS.find(s => s.id === sel) : null;
    return `<section class="panel">
      <div class="eyebrow">Alle kamers hersteld</div>
      <h2 class="px" style="font-size:clamp(24px,4vw,32px);margin:6px 0 10px">Wie nam de NovaBox?</h2>
      <p>Lees je zes aanwijzingen en streep verdachten door in je dossier. Kies dan de dader. Een foute beschuldiging kost ${T.WRONG_ACCUSATION} punten.</p>
      <div class="suspects">${cards}</div>
      ${S.msg ? `<div class="msg" role="alert">${S.msg}</div>` : ''}
      <div class="actions">${who ? `<button class="btn danger" data-act="confirm">Ja, ik beschuldig ${esc(who.naam)}</button><button class="linkbtn" data-act="cancel">Annuleren</button>` : `<button class="btn" disabled>Kies eerst een verdachte</button>`}
        <button class="linkbtn" data-act="room" data-id="${rooms.length}">Terug naar de kamers</button></div>
    </section>`;
  }
  function resultText() {
    const d = new Date().toLocaleDateString('nl-BE');
    return `NovaBox-zaak | ${S.name || 'zonder naam'} | score ${score()}/${T.START_SCORE} | tips gebruikt: ${hintCount()} | foute beschuldigingen: ${S.wrong.length} | ${d}`;
  }
  function finalHTML() {
    const culprit = T.SUSPECTS.find(s => s.id === T.CULPRIT);
    const chain = rooms.map((r, i) => { const s = T.SUSPECTS.find(x => x.id === T.ELIMINATION[i]); return `<tr><td>${i + 1}. ${esc(r.clue.titel)}</td><td>${esc(s.naam)} valt af</td></tr>`; }).join('');
    const sc = score();
    return `<section class="panel final">
      <div class="eyebrow">Zaak gesloten</div>
      <h2>${esc(culprit.naam)} nam de NovaBox</h2>
      <p>Elise Dumon, programmeur bij Pixelwerf, bleef na haar shift in het gebouw. Om 22:15 stapte ze de lift uit op verdieping 2, haalde de NovaBox uit de kluis en liet per ongeluk een bekertje thee achter. Het prototype zat in haar rugzak. Ze wilde de console tonen aan een concurrent om er te kunnen solliciteren.</p>
      <div class="grid"><div><div class="px" style="font-size:12px;letter-spacing:.12em;color:var(--muted)">SCORE</div><div class="big">${sc}</div></div>
        <div><div class="rating">${ratingFor(sc)}</div><p style="margin:4px 0 0;color:var(--muted)">${hintCount()} tip(s) gebruikt · ${S.wrong.length} foute beschuldiging(en)</p></div></div>
      <h3 style="font-size:16px">Zo viel iedereen af</h3>
      <table class="chain"><thead><tr><th>Aanwijzing</th><th>Gevolg</th></tr></thead><tbody>${chain}<tr><td colspan="2"><b>Wie overblijft: ${esc(culprit.naam)}.</b></td></tr></tbody></table>
      <h3 style="font-size:16px;margin-top:22px">Jouw resultaat</h3>
      <p class="tip">Kopieer dit en bezorg het aan je leerkracht.</p>
      <textarea class="copy" id="result" rows="3" readonly>${esc(resultText())}</textarea>
      <div class="actions"><button class="btn primary" data-act="copy">Kopieer resultaat</button><button class="btn" data-act="review">Kamers herbekijken</button><button class="linkbtn" data-act="restart">Opnieuw beginnen</button></div>
      <p class="tip" id="copied" aria-live="polite"></p>
    </section>`;
  }

  /* ---------------------------------------------------------------- editors */
  function setupEditors() {
    $$('.editor').forEach(ed => {
      const ta = $('textarea', ed), g = $('.gutter', ed); if (!ta || ta.dataset.ready) return; ta.dataset.ready = '1';
      const upd = (errLine) => {
        const n = ta.value.split('\n').length; ta.style.height = (n * 21 + 38) + 'px';
        g.innerHTML = Array.from({ length: n }, (_, i) => `<span class="${i + 1 === errLine ? 'err' : ''}">${i + 1}</span>`).join('');
      };
      ta._upd = upd; upd();
      let esc_ = false;
      ta.addEventListener('input', () => {
        upd();
        const id = ta.dataset.step;
        if (ed.dataset.ed === 'main') S.drafts[id] = ta.value; else S.scratch[id] = ta.value;
        save();
      });
      ta.addEventListener('keydown', e => {
        if (e.key === 'Escape') { esc_ = true; return; }
        if (e.key === 'Tab' && !e.shiftKey && !esc_) { e.preventDefault(); ta.setRangeText('    ', ta.selectionStart, ta.selectionEnd, 'end'); ta.dispatchEvent(new Event('input')); return; }
        if (e.key === 'Tab') { esc_ = false; return; }
        esc_ = false;
        if (e.key === 'Enter') {
          e.preventDefault();
          const v = ta.value, p = ta.selectionStart;
          const ls = v.lastIndexOf('\n', p - 1) + 1; const line = v.slice(ls, p);
          let ind = /^\s*/.exec(line)[0];
          const before = v.slice(0, p).trimEnd(); const after = v[p];
          if (before.endsWith('{')) {
            if (after === '}') { ta.setRangeText('\n' + ind + '    ' + '\n' + ind, p, ta.selectionEnd, 'end'); ta.selectionStart = ta.selectionEnd = p + 1 + ind.length + 4; }
            else ta.setRangeText('\n' + ind + '    ', p, ta.selectionEnd, 'end');
          } else ta.setRangeText('\n' + ind, p, ta.selectionEnd, 'end');
          ta.dispatchEvent(new Event('input'));
          return;
        }
        if (e.key === '}') {
          const v = ta.value, p = ta.selectionStart; const ls = v.lastIndexOf('\n', p - 1) + 1;
          const line = v.slice(ls, p);
          if (/^ +$/.test(line) && line.length >= 4 && ta.selectionStart === ta.selectionEnd) { e.preventDefault(); ta.setRangeText('}', p - 4, p, 'end'); ta.dispatchEvent(new Event('input')); }
        }
      });
    });
  }

  /* ---------------------------------------------------------------- resultaten tonen */
  function showResults(st, res) {
    const box = $('#res-' + st.id); if (!box) return;
    const ta = $('#ed-' + st.id);
    if (res.syntax) {
      box.innerHTML = `<div class="syntax"><b>Syntaxfout op regel ${res.syntax.line}</b><br>${esc(res.syntax.message)}<br><span class="tip">De compiler kan je code nog niet lezen. Los dit op en controleer opnieuw.</span></div>`;
      if (ta && ta._upd) ta._upd(res.syntax.line);
      return;
    }
    if (ta && ta._upd) ta._upd(0);
    const okN = res.results.filter(r => r.ok).length, tot = res.results.length;
    const rows = res.results.map(r => {
      let extra = '';
      if (!r.ok && !r.skipped && r.kind === 'test') {
        if (r.expected !== undefined && r.got !== undefined) extra = `<div class="cols"><div><h5>Verwacht</h5><pre>${esc(r.expected)}</pre></div><div><h5>Jouw uitvoer</h5><pre>${esc(r.got)}</pre></div></div>`;
        extra += `<details class="t"><summary>Toon de testcode</summary><pre class="code" style="margin-top:6px">${esc(r.main)}</pre></details>`;
      }
      return `<div class="res ${r.ok ? 'ok' : 'bad'}"><span class="ic">${r.ok ? I.ok : I.no}</span><div><div>${esc(r.label)}</div>${r.detail ? `<div class="why">${esc(r.detail)}</div>` : ''}${r.ok && r.note ? `<div class="why">${esc(r.note)}</div>` : ''}${extra}</div></div>`;
    }).join('');
    const sum = res.pass ? `<div class="sum ok">${I.ok} Alle controles geslaagd (${okN}/${tot}).</div>` : `<div class="sum bad"><span>${okN} van ${tot} controles geslaagd.</span> Kijk bij de rode regels wat er nog niet klopt.</div>`;
    box.innerHTML = sum + rows;
  }
  function completeStep(id) {
    S.done[id] = true; save();
    const room = rooms.find(r => r.steps.some(s => s.id === id));
    const sy = window.scrollY;
    renderWork();
    if (roomDone(room)) { const c = $('#clue'); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    else window.scrollTo(0, sy);
  }

  /* ---------------------------------------------------------------- events */
  function findStep(id) { for (const r of rooms) for (const s of r.steps) if (s.id === id) return s; return null; }
  function bindGame() {
    view.addEventListener('click', onClick);
    view.addEventListener('input', onInput);
    view.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('tr[data-act="excl"]')) { e.preventDefault(); e.target.click(); } });
  }
  function onInput(e) {
    const t = e.target;
    if (t.matches && t.matches('textarea.answer')) { S.ans[t.dataset.step] = t.value; save(); }
  }
  function onClick(e) {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const act = el.dataset.act;
    if (act === 'tab') { S.tab = el.dataset.v; save(); $('.game').dataset.tab = S.tab; renderDossier(); window.scrollTo(0, 0); return; }
    if (act === 'room') { S.view = 'room'; S.open = +el.dataset.id; S.tab = 'work'; save(); render(); window.scrollTo(0, 0); return; }
    if (act === 'excl') { const id = el.dataset.id; const i = S.excl.indexOf(id); if (i >= 0) S.excl.splice(i, 1); else S.excl.push(id); save(); renderDossier(); return; }
    if (act === 'accuse') { if (!allDone()) return; S.view = 'accuse'; S.tab = 'work'; S.msg = ''; save(); render(); window.scrollTo(0, 0); return; }
    if (act === 'pick') { S.pending = el.dataset.id; S.msg = ''; save(); renderWork(); return; }
    if (act === 'cancel') { S.pending = null; save(); renderWork(); return; }
    if (act === 'confirm') {
      if (S.pending === T.CULPRIT) { S.finished = true; S.view = 'final'; S.msg = ''; save(); render(); window.scrollTo(0, 0); return; }
      const who = T.SUSPECTS.find(s => s.id === S.pending); S.wrong.push(S.pending);
      const idx = T.ELIMINATION.indexOf(S.pending);
      S.msg = `${esc(who.naam)} is het niet. Je verliest ${T.WRONG_ACCUSATION} punten. ` + (idx >= 0 ? `Aanwijzing ${idx + 1} (${esc(rooms[idx].clue.titel)}) spreekt dit tegen.` : `Controleer je aanwijzingen nog eens.`);
      S.pending = null; save(); renderWork(); return;
    }
    if (act === 'review') { S.view = 'room'; S.open = 1; save(); render(); window.scrollTo(0, 0); return; }
    if (act === 'restart') { if (el.dataset.sure) { const name = S.name; S = fresh(); S.name = name; save(); lastScore = null; render(); window.scrollTo(0, 0); } else { el.dataset.sure = '1'; el.textContent = 'Zeker? Klik nog eens om alles te wissen'; } return; }
    if (act === 'copy') {
      const ta = $('#result'), msg = $('#copied');
      const fallback = () => { ta.focus(); ta.select(); msg.textContent = 'Kopiëren lukt hier niet automatisch. De tekst is geselecteerd: kopieer met Ctrl+C (of Cmd+C).'; };
      try { navigator.clipboard.writeText(ta.value).then(() => { msg.textContent = 'Gekopieerd.'; }, fallback); } catch (er) { fallback(); }
      return;
    }
    /* stappen */
    const st = el.dataset.step ? findStep(el.dataset.step) : null;
    if (act === 'hint') {
      const r = rooms[+el.dataset.room - 1]; const i = +el.dataset.i; if ((S.hints[r.id] || 0) !== i) return;
      S.hints[r.id] = i + 1; save(); const sy = window.scrollY; renderWork(); window.scrollTo(0, sy); return;
    }
    if (!st) return;
    if (act === 'cls') { const sel = S.sel[st.id] = S.sel[st.id] || {}; sel[el.dataset.i] = el.dataset.v; save(); $$('[data-act="cls"][data-i="' + el.dataset.i + '"]', el.parentNode).forEach(b => b.setAttribute('aria-pressed', b === el)); return; }
    if (act === 'chk-cls') {
      const sel = S.sel[st.id] || {}; const n = st.items.filter((it, i) => sel[i] === it.a).length; const box = $('#res-' + st.id);
      if (Object.keys(sel).length < st.items.length) { box.innerHTML = `<div class="sum bad"><span>Kies eerst bij elk brokstuk een soort.</span></div>`; return; }
      if (n === st.items.length) { completeStep(st.id); return; }
      box.innerHTML = `<div class="sum bad"><span>${n} van ${st.items.length} brokstukken staan op de juiste plek.</span> Denk na over de verschillen en probeer opnieuw. Een tip kan helpen.</div>`; return;
    }
    if (act === 'mc') { const sel = S.sel[st.id] = S.sel[st.id] || {}; sel[el.dataset.q] = +el.dataset.o; save(); $$('[data-act="mc"][data-q="' + el.dataset.q + '"]', el.parentNode).forEach(b => b.setAttribute('aria-pressed', b === el)); return; }
    if (act === 'chk-mc') {
      const sel = S.sel[st.id] || {}; let ok = 0;
      if (Object.keys(sel).length < st.vragen.length) { $('#res-' + st.id).innerHTML = `<div class="sum bad"><span>Beantwoord eerst alle vragen.</span></div>`; return; }
      st.vragen.forEach((q, qi) => { const good = sel[qi] === q.juist; if (good) ok++; const box = $('#q-' + st.id + '-' + qi); box.classList.toggle('ok', good); box.classList.toggle('bad', !good); $('.fb', box).innerHTML = good ? esc(q.uitleg) : 'Nog niet juist. Lees de vraag opnieuw.'; });
      if (ok === st.vragen.length) { setTimeout(() => completeStep(st.id), 700); } else $('#res-' + st.id).innerHTML = `<div class="sum bad"><span>${ok} van ${st.vragen.length} juist.</span> Pas de rode vragen aan en controleer opnieuw.</div>`;
      return;
    }
    if (act === 'mv') { const list = orderList(st).slice(); const i = +el.dataset.i, d = +el.dataset.d; const j = i + d; if (j < 0 || j >= list.length) return; [list[i], list[j]] = [list[j], list[i]]; S.ord[st.id] = list; save(); const sy = window.scrollY; renderWork(); window.scrollTo(0, sy); return; }
    if (act === 'chk-ord') {
      const list = orderList(st); const n = list.filter((t, i) => t === st.juist[i]).length;
      if (n === list.length) { completeStep(st.id); return; }
      $('#res-' + st.id).innerHTML = `<div class="sum bad"><span>${n} van ${list.length} staan op de juiste plaats.</span> Denk aan de volgorde waarin je de onderdelen in H2 leerde.</div>`; return;
    }
    if (act === 'chk-pred') {
      const exp = T.predictExpected(st); const got = (S.ans[st.id] || '');
      const norm = s => T.normOut(s.replace(/\r/g, '').split('\n')).toLowerCase();
      if (norm(got) === norm(exp)) { completeStep(st.id); return; }
      $('#res-' + st.id).innerHTML = `<div class="sum bad"><span>Dat is niet de uitvoer.</span> Voer de code regel per regel uit in je hoofd. Let op: elke Console.WriteLine geeft één regel.</div>`; return;
    }
    if (act === 'check') {
      const ta = $('#ed-' + st.id); const code = ta.value; S.drafts[st.id] = code; save();
      const res = T.checkCode(st, code); showResults(st, res);
      if (res.pass && !S.done[st.id]) setTimeout(() => completeStep(st.id), 900);
      return;
    }
    if (act === 'reset') { delete S.drafts[st.id]; save(); renderWork(); return; }
    if (act === 'run') {
      const code = $('#ed-' + st.id).value, main = $('#sc-' + st.id).value; const out = $('#out-' + st.id);
      const r = T.runScratch(st, code, main);
      if (r.ok) { out.className = 'out'; out.textContent = r.out.length ? r.out.join('\n') : '(geen uitvoer)'; }
      else { out.className = 'out err'; out.textContent = CS.fmtError(r.error) + (r.error.file === 'test' ? '  (in je testcode)' : '') + (r.out.length ? '\n\nUitvoer tot dan:\n' + r.out.join('\n') : ''); }
      return;
    }
  }

  bindGame();
  render();
})();
</script>
</body></html>
